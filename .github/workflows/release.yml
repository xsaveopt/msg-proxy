name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read
  packages: write

env:
  KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/msg-proxy

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Go build
        run: go build -trimpath -ldflags="-s -w" ./...

      - name: Go test
        run: go test -race ./...

  ko-build:
    name: ko build (no push)
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: ko-build/setup-ko@v0.7
      - name: Build (no push)
        run: |
          ko build --sbom=none --push=false --base-import-paths ./cmd/server
          ko build --sbom=none --push=false --base-import-paths ./cmd/client

  publish-dev:
    name: Publish :dev images
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: ko-build/setup-ko@v0.7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push :dev
        run: |
          ko build --sbom=none --tags="dev" --base-import-paths ./cmd/server
          ko build --sbom=none --tags="dev" --base-import-paths ./cmd/client

  publish:
    name: Publish images
    needs: ci
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: ko-build/setup-ko@v0.7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          ref="${GITHUB_REF_NAME#v}"
          major="${ref%%.*}"
          rest="${ref#*.}"
          minor="${rest%%.*}"
          tags="$ref,$major.$minor,$major"
          if [[ "$ref" != *-* ]]; then
            tags="$tags,latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          ko build --sbom=none --tags="${{ steps.tags.outputs.tags }}" --base-import-paths ./cmd/server
          ko build --sbom=none --tags="${{ steps.tags.outputs.tags }}" --base-import-paths ./cmd/client
